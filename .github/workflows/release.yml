# Pushing a tag like v0.2.0 builds the signed installer on Windows and publishes it as a
# GitHub release with the latest.json that installed copies of kit check for updates, plus
# kit's NK65 firmware (built with QMK at the commit in firmware/nk65/QMK_VERSION).
# The tests (check.yml), the firmware and the installer build run side by side, and the
# release is only published when all three pass.
# Running it by hand (Actions > release > Run workflow) only builds and keeps the installer
# as a workflow artifact.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# Only the job that publishes the release can write to the repo.
permissions:
  contents: read

jobs:
  check:
    uses: ./.github/workflows/check.yml

  firmware:
    runs-on: ubuntu-latest
    container: ghcr.io/qmk/qmk_cli
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Get QMK
        run: |
          git init -q qmk_firmware
          cd qmk_firmware
          git remote add origin https://github.com/qmk/qmk_firmware
          git fetch -q --depth 1 origin "$(cat ../firmware/nk65/QMK_VERSION)"
          git checkout -q FETCH_HEAD
          git submodule update -q --init --depth 1

      - name: Build
        run: sh firmware/nk65/build.sh qmk_firmware firmware-out

      - uses: actions/upload-artifact@v7
        with:
          name: nk65-firmware
          path: firmware-out/*.bin

  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@stable

      # Restores the cache check.yml saves on main; tag runs don't save their own.
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: windows
          save-if: false

      # The prebuilt binary from Tauri's release, checked against its known hash. Building it
      # from source took 7 to 10 minutes whenever the cache missed.
      - name: Install the Tauri CLI
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAURI_CLI: "2.12.4"
          TAURI_CLI_SHA256: 3e8687fb184bd7f10ebd8642f7715f79f4a605c0694c142a21507e8a24dc0f8b
        run: |
          $zip = "$env:RUNNER_TEMP\cargo-tauri.zip"
          gh release download "tauri-cli-v$env:TAURI_CLI" -R tauri-apps/tauri -p cargo-tauri-x86_64-pc-windows-msvc.zip -O $zip
          if ((Get-FileHash $zip -Algorithm SHA256).Hash -ne $env:TAURI_CLI_SHA256) { throw "the Tauri CLI download doesn't match its hash" }
          Expand-Archive $zip "$env:RUNNER_TEMP\cargo-tauri"
          "$env:RUNNER_TEMP\cargo-tauri" >> $env:GITHUB_PATH

      - name: Check the tag matches the app version
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $version = (Get-Content app/src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          if ("v$version" -ne "${{ github.ref_name }}") { throw "tag ${{ github.ref_name }} doesn't match tauri.conf.json version $version" }

      # The app's build script needs the APO DLL it bundles, so build that first.
      - name: Build the APO
        run: cargo build --release --locked -p kit-apo

      # The signing key is only visible to the step that signs.
      - name: Build
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          cd app/src-tauri
          cargo tauri build

      - name: Keep the installer
        uses: actions/upload-artifact@v7
        with:
          name: kit-installer
          path: |
            target/release/bundle/nsis/*-setup.exe
            target/release/bundle/nsis/*-setup.exe.sig

  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [check, firmware, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/download-artifact@v8
        with:
          name: kit-installer
          path: installer

      - uses: actions/download-artifact@v8
        with:
          name: nk65-firmware
          path: firmware-out

      - name: Publish the release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.ref_name }}"
          $version = $tag.TrimStart("v")
          $exe = Get-Item "installer/kit_${version}_x64-setup.exe"
          $sig = Get-Content "$($exe.FullName).sig" -Raw
          # Release notes are the annotated tag's message.
          git fetch --force origin "refs/tags/${tag}:refs/tags/${tag}"
          $notes = (git tag -l --format="%(contents)" $tag | Out-String).Trim()
          if (-not $notes) { $notes = "kit $version" }
          @{
            version  = $version
            notes    = $notes
            pub_date = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ssZ")
            platforms = @{
              "windows-x86_64" = @{
                signature = $sig.Trim()
                url       = "https://github.com/${{ github.repository }}/releases/download/$tag/$($exe.Name)"
              }
            }
          } | ConvertTo-Json -Depth 4 | Set-Content latest.json -Encoding utf8NoBOM
          Set-Content notes.md $notes -Encoding utf8NoBOM
          gh release create $tag $exe.FullName latest.json (Get-ChildItem firmware-out/*.bin).FullName --title "kit $version" --notes-file notes.md
