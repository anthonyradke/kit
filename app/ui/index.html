<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>headroom</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="titlebar" data-tauri-drag-region>
    <div class="tb-brand" data-tauri-drag-region>
      <svg class="tb-mark" viewBox="0 0 24 24" aria-hidden="true" data-tauri-drag-region>
        <defs>
          <linearGradient id="markGrad" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#8b5cf6" /><stop offset="1" stop-color="#38bdf8" />
          </linearGradient>
        </defs>
        <path d="M4 15v-3a8 8 0 0 1 16 0v3" fill="none" stroke="url(#markGrad)" stroke-width="2.6" stroke-linecap="round" />
        <rect x="2.5" y="13" width="5" height="8" rx="2.2" fill="url(#markGrad)" />
        <rect x="16.5" y="13" width="5" height="8" rx="2.2" fill="url(#markGrad)" />
      </svg>
      <span data-tauri-drag-region>headroom</span>
    </div>
    <nav class="nav-tabs">
      <button class="nav-tab" data-act="page" data-page="sound">Sound</button>
      <button class="nav-tab" data-act="page" data-page="mic">Mic</button>
      <button class="nav-tab" data-act="page" data-page="settings">Settings</button>
    </nav>
    <div class="tb-spacer" data-tauri-drag-region></div>
    <div class="tb-device" id="device" data-tauri-drag-region></div>
    <div class="win-controls">
      <button class="win-btn" data-act="win-min" title="Minimize">
        <svg viewBox="0 0 12 12"><path d="M1 6h10" /></svg>
      </button>
      <button class="win-btn close" data-act="win-close" title="Close to tray">
        <svg viewBox="0 0 12 12"><path d="M1.5 1.5l9 9M10.5 1.5l-9 9" /></svg>
      </button>
    </div>
  </header>

  <main id="main" class="main"></main>
  <div id="toast" class="toast"></div>
  <script src="app.js"></script>
</body>
</html>
