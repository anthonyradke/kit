<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>kit</title>
  <link rel="preload" href="fonts/archivo.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="stylesheet" href="style.css" />
  <script src="theme.js"></script>
</head>
<body>
  <header class="titlebar" data-tauri-drag-region>
    <div class="wordmark" data-tauri-drag-region>kit</div>
    <div class="tb-title" id="tb-title" data-tauri-drag-region></div>
    <nav class="tabs" id="tabs" aria-label="Sections"></nav>
    <div class="tb-spacer" data-tauri-drag-region></div>
    <button class="tb-upd" id="upd" data-act="update" hidden></button>
    <div class="win-controls">
      <button class="win-btn" data-act="win-min" title="Minimize" aria-label="Minimize">
        <svg viewBox="0 0 12 12"><path d="M1 6h10" /></svg>
      </button>
      <button class="win-btn" id="win-max" data-act="win-max" title="Maximize" aria-label="Maximize">
        <svg viewBox="0 0 12 12"><rect x="1.5" y="1.5" width="9" height="9" /></svg>
      </button>
      <button class="win-btn close" data-act="win-close" title="Close to tray" aria-label="Close to tray">
        <svg viewBox="0 0 12 12"><path d="M1.5 1.5l9 9M10.5 1.5l-9 9" /></svg>
      </button>
    </div>
  </header>

  <div class="shell">
    <nav class="rail" id="rail" aria-label="Devices"></nav>
    <main id="main" class="main"></main>
  </div>
  <div id="toast" class="toast" role="status"></div>

  <script src="core.js"></script>
  <script src="mouse.js"></script>
  <script src="headset.js"></script>
  <script src="lighting.js"></script>
  <script src="keyboard.js"></script>
  <script src="app.js"></script>
</body>
</html>
