[workspace]
resolver = "2"
members = [
    "crates/hidpp",
    "crates/mouse-probe",
    "crates/arctis",
    "crates/apo",
    "crates/sysaudio",
    "crates/headset-probe",
    "crates/via",
    "app/src-tauri",
]

[workspace.package]
edition = "2021"
license = "MIT"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
# Unwind (not abort) so a bug in the APO falls back to passthrough instead of
# taking down audiodg.exe.

# DeepFilterNet (the mic APO's model) is far too slow unoptimized for the
# denoise tests, which run at the audio engine's pace, and for a debug APO.
# Its inference and math crates are built like release in dev and test builds
# too; tract's debug-only graph checks also reject the model.
[profile.dev.package.deep_filter]
opt-level = 3
debug-assertions = false
overflow-checks = false
[profile.dev.package.tract-core]
opt-level = 3
debug-assertions = false
overflow-checks = false
[profile.dev.package.tract-linalg]
opt-level = 3
debug-assertions = false
overflow-checks = false
[profile.dev.package.tract-data]
